<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字论证生成器</title>
  </head>
  <body>
    <div id="app">
      <h1>数字论证生成器</h1>
      <h2>NumProof Gen</h2>
      <form id="settings">
        <div>
          <label for="input">要论证的结果为：</label>
          <input name="input" id="input" type="number" />
        </div>
        <div>
          <label for="mode">用于论证的数字：</label>
          <input
            name="mode"
            id="mode"
            type="number"
            maxlength="11"
            value="1234"
          />
        </div>
        <div class="enable-random-container">
          <label for="enable-random">启用随机数</label>
          <input type="checkbox" name="enable-random" id="enable-random" />
        </div>
      </form>
      <p id="result"></p>
      <div id="other-formats" style="display: none">
        <div class="tabs">
          <button>数学符号</button>
          <button>Python</button>
          <button>TeX</button>
          <button>分享链接</button>
        </div>
        <div style="display: block">
          <pre></pre>
          <div>
            <span id="other-formats-chars"></span>
            <span id="other-formats-format"></span>
            <button id="other-formats-copy">复制</button>
          </div>
        </div>
      </div>
    </div>
    <footer id="footer">
      <a href="https://github.com/IsBenben/num-proof-gen" target="_blank">GitHub</a> · 0.1.0
    </footer>
    <script type="module" src="/src/scripts/main.ts"></script>
  </body>
</html>
